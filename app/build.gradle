plugins {
    id 'com.android.application'
}

android {
    namespace 'com.indaya.vistoria'
    compileSdk 35

    defaultConfig {
        applicationId 'com.indaya.vistoria'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '1.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
}
